      go:
        package: "claimdb"
        out: "internal/modules/claim/repository/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  # submission module queries
  - engine: "postgresql"
    queries: "internal/modules/submission/repository/queries"
    schema: "migrations"
    gen:
      go:
        package: "submissiondb"
        out: "internal/modules/submission/repository/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  # feedback module queries
  - engine: "postgresql"
    queries: "internal/modules/feedback/repository/queries"
    schema: "migrations"
    gen:
      go:
        package: "feedbackdb"
        out: "internal/modules/feedback/repository/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

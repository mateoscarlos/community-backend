        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  # claim module queries
  - engine: "postgresql"
    queries: "internal/modules/claim/repository/queries"

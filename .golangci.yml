version: "2"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # suspicious constructs
    - staticcheck    # static analysis
    - unused         # unused code
    - ineffassign    # ineffectual assignments
    - gosimple       # simplification suggestions
    - gofmt          # formatting
    - misspell       # typos

linters-settings:
  gofmt:
    simplify: true
